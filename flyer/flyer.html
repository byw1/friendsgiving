<style>
  /* Layout: one 4:5 poster frame centered on a night field; 3D scene fills it, type sits in the bottom third. */
  :root {
    --night: #080505;
    --ink: #f7ead9;
    --mute: #c9b29a;
    --ember: #ff7a2f;
    --gold: #ffc35a;
    --cranberry: #ff4f3a;
    --display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
    --body: "Geist", "Helvetica Neue", Arial, sans-serif;
    --neon: "Yellowtail", "Brush Script MT", cursive;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--night);
    color: var(--ink);
    font-family: var(--body);
    display: grid;
    place-items: center;
    overflow: hidden;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px;
    box-sizing: border-box;
  }
  body.capture { padding: 0; }
  .stage {
    position: relative;
    width: min(100%, calc((100dvh - 32px) * 0.8));
    max-width: 100%;
    aspect-ratio: 4 / 5;
    border-radius: 18px;
    overflow: hidden;
    container-type: inline-size;
    background: var(--night);
    box-shadow: 0 40px 120px -40px rgb(255 122 47 / 0.35);
  }
  body.capture .stage { width: 100vw; border-radius: 0; box-shadow: none; }
  canvas.gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .vignette {
    position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(120% 80% at 50% 38%, transparent 45%, rgb(8 5 5 / 0.75) 100%),
      linear-gradient(to bottom, rgb(8 5 5 / 0.55), transparent 16%, transparent 52%, rgb(8 5 5 / 0.92) 80%, var(--night));
  }
  .grain {
    position: absolute; inset: 0; pointer-events: none; opacity: 0.07; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  .top {
    position: absolute; left: 5.5cqw; right: 5.5cqw; top: 5cqw;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 2.6cqw; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 500; color: var(--mute);
  }
  .top b { color: var(--gold); font-weight: 600; }

  .bottom {
    position: absolute; left: 6cqw; right: 6cqw; bottom: 5.5cqw;
    display: grid; grid-template-columns: 1fr auto; gap: 3cqw 5cqw; align-items: end;
  }
  h1 {
    grid-column: 1 / -1;
    margin: 0;
    font-family: var(--display);
    font-weight: 400;
    font-size: 17cqw;
    line-height: 0.85;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }
  h1 em {
    font-style: italic;
    background: linear-gradient(100deg, #ffd27a, #ff8a3d 55%, #ff5a3a);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    padding-right: 0.06em;
  }
  .details { display: grid; gap: 1.6cqw; min-width: 0; }
  .when { font-size: 4.3cqw; font-weight: 600; letter-spacing: -0.01em; }
  .when span { color: var(--ember); padding: 0 0.35em; }
  .who { font-size: 3.1cqw; color: var(--mute); line-height: 1.45; }
  .who strong { color: var(--ink); font-weight: 500; }
  .qr { display: grid; justify-items: center; gap: 1.2cqw; }
  .qr .code {
    width: 17cqw; aspect-ratio: 1; border-radius: 2.2cqw; background: var(--ink); padding: 1.3cqw; box-sizing: border-box;
    box-shadow: 0 0 0 0.3cqw rgb(255 195 90 / 0.35), 0 1.5cqw 5cqw -1cqw rgb(255 122 47 / 0.5);
  }
  .qr .code svg { width: 100%; height: 100%; display: block; }
  .qr small { font-size: 2.2cqw; letter-spacing: 0.18em; text-transform: uppercase; color: var(--mute); font-weight: 500; }

  .reveal { opacity: 0; transform: translateY(2cqw); will-change: opacity, transform; }
  .fade { position: absolute; inset: 0; background: var(--night); opacity: 0; pointer-events: none; }

  .fallback { position: absolute; inset: 0; display: none; place-items: center; color: var(--mute); font-size: 3cqw; }

  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1 !important; transform: none !important; }
  }
</style>

<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const RSVP_URL = "https://web-production-900ae187.up.railway.app";
const CAPTURE = location.hash === "#capture";
const LOOP = 12; // seconds; every moving thing repeats on this period
if (CAPTURE) document.body.classList.add("capture");

/* ---------- QR ---------- */
try {
  const qr = qrcode(0, "M");
  qr.addData(RSVP_URL);
  qr.make();
  document.getElementById("qr").innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
  const svg = document.querySelector("#qr svg");
  svg.querySelectorAll("rect").forEach((r) => r.setAttribute("fill", r.getAttribute("fill") === "#000000" ? "#1a0f0a" : "transparent"));
  svg.querySelectorAll("path").forEach((p) => p.setAttribute("fill", "#1a0f0a"));
} catch (e) { console.warn(e); }

/* ---------- helpers ---------- */
const rand = (() => { let s = 7; return () => ((s = (s * 16807) % 2147483647) / 2147483647); })();
const ease = (x) => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);
const clamp01 = (x) => Math.min(Math.max(x, 0), 1);
const TAU = Math.PI * 2;

function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}

function noise(ctx, w, h, base, amt, n = 9000) {
  ctx.fillStyle = base; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < n; i++) {
    const v = Math.floor(rand() * amt);
    ctx.fillStyle = `rgba(${v},${v * 0.8},${v * 0.6},${0.05 + rand() * 0.08})`;
    ctx.fillRect(rand() * w, rand() * h, 1 + rand() * 4, 1 + rand() * 4);
  }
}

const woodTex = canvasTex(512, 1024, (ctx, w, h) => {
  ctx.fillStyle = "#2a1b13"; ctx.fillRect(0, 0, w, h);
  for (let x = 0; x < w; x += 2) {
    const v = 30 + Math.sin(x * 0.07) * 8 + rand() * 14;
    ctx.fillStyle = `rgba(${v + 40},${v + 18},${v},0.35)`;
    ctx.fillRect(x, 0, 1 + rand() * 2, h);
  }
  // peeling paint flecks
  for (let i = 0; i < 260; i++) {
    ctx.fillStyle = `rgba(${90 + rand() * 40},${70 + rand() * 30},${55 + rand() * 20},${0.18 + rand() * 0.2})`;
    ctx.beginPath();
    ctx.ellipse(rand() * w, rand() * h, 2 + rand() * 10, 4 + rand() * 30, 0, 0, TAU);
    ctx.fill();
  }
});

const wallTex = canvasTex(1024, 1024, (ctx, w, h) => {
  noise(ctx, w, h, "#1b1412", 70, 26000);
  ctx.strokeStyle = "rgba(0,0,0,0.35)"; ctx.lineWidth = 3;
  for (let y = 0; y < h; y += 64) {
    ctx.beginPath(); ctx.moveTo(0, y + rand() * 3); ctx.lineTo(w, y + rand() * 3); ctx.stroke();
    for (let x = (y / 64) % 2 ? 0 : 64; x < w; x += 128) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 64); ctx.stroke(); }
  }
});
wallTex.wrapS = wallTex.wrapT = THREE.RepeatWrapping;
wallTex.repeat.set(3, 2);

const floorTex = canvasTex(1024, 1024, (ctx, w, h) => noise(ctx, w, h, "#140e0b", 60, 30000));
floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
floorTex.repeat.set(4, 4);

const glowTex = canvasTex(512, 1024, (ctx, w, h) => {
  const g = ctx.createRadialGradient(w * 0.5, h * 0.55, 10, w * 0.5, h * 0.55, h * 0.6);
  g.addColorStop(0, "#fff1c7");
  g.addColorStop(0.25, "#ffc35a");
  g.addColorStop(0.6, "#ff7a2f");
  g.addColorStop(1, "#3a1206");
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
});

/* ---------- renderer ---------- */
const stage = document.getElementById("stage");
const canvas = document.getElementById("gl");
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance", preserveDrawingBuffer: CAPTURE });
} catch (e) {
  document.getElementById("fallback").style.display = "grid";
  document.querySelectorAll(".reveal").forEach((el) => { el.style.opacity = 1; el.style.transform = "none"; });
  throw e;
}
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color("#090505");
scene.fog = new THREE.FogExp2("#120806", 0.055);

const camera = new THREE.PerspectiveCamera(34, 4 / 5, 0.1, 80);

scene.add(new THREE.HemisphereLight("#4a3a5a", "#3a1c0e", 1.0));

/* ---------- wall with a door-shaped hole ---------- */
const OPEN_W = 2.2, OPEN_H = 4.4;
const wallShape = new THREE.Shape();
wallShape.moveTo(-9, -1); wallShape.lineTo(9, -1); wallShape.lineTo(9, 11); wallShape.lineTo(-9, 11); wallShape.lineTo(-9, -1);
const hole = new THREE.Path();
hole.moveTo(-OPEN_W / 2, 0); hole.lineTo(-OPEN_W / 2, OPEN_H); hole.lineTo(OPEN_W / 2, OPEN_H); hole.lineTo(OPEN_W / 2, 0); hole.lineTo(-OPEN_W / 2, 0);
wallShape.holes.push(hole);
const wallGeo = new THREE.ShapeGeometry(wallShape);
{ // planar UVs
  const p = wallGeo.attributes.position, uv = wallGeo.attributes.uv;
  for (let i = 0; i < p.count; i++) uv.setXY(i, (p.getX(i) + 9) / 18, (p.getY(i) + 1) / 12);
}
const wall = new THREE.Mesh(wallGeo, new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.95, color: "#8a7468" }));
scene.add(wall);

// Wall thickness around the opening (the reveal you see as the door swings in)
const jambMat = new THREE.MeshStandardMaterial({ color: "#2b1d16", roughness: 0.9 });
const jambs = [
  [0.08, OPEN_H, 0.5, -OPEN_W / 2 - 0.04, OPEN_H / 2, -0.25],
  [0.08, OPEN_H, 0.5, OPEN_W / 2 + 0.04, OPEN_H / 2, -0.25],
  [OPEN_W + 0.16, 0.08, 0.5, 0, OPEN_H + 0.04, -0.25],
];
jambs.forEach(([w, h, d, x, y, z]) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), jambMat); m.position.set(x, y, z); scene.add(m); });

// Trim
const trimMat = new THREE.MeshStandardMaterial({ map: woodTex, color: "#7a5a46", roughness: 0.8 });
[
  [0.22, OPEN_H + 0.22, 0.12, -OPEN_W / 2 - 0.11, (OPEN_H + 0.22) / 2, 0.06],
  [0.22, OPEN_H + 0.22, 0.12, OPEN_W / 2 + 0.11, (OPEN_H + 0.22) / 2, 0.06],
  [OPEN_W + 0.66, 0.24, 0.16, 0, OPEN_H + 0.12, 0.08],
].forEach(([w, h, d, x, y, z]) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), trimMat); m.position.set(x, y, z); scene.add(m); });

// What's beyond the door: warm, bright, a party already going
const glow = new THREE.Mesh(new THREE.PlaneGeometry(OPEN_W + 0.6, OPEN_H + 0.4), new THREE.MeshBasicMaterial({ map: glowTex, toneMapped: false }));
glow.material.color.setScalar(1.35);
glow.position.set(0, OPEN_H / 2, -1.6);
scene.add(glow);

/* ---------- door ---------- */
const hinge = new THREE.Group();
hinge.position.set(-OPEN_W / 2 + 0.02, 0, -0.05);
scene.add(hinge);
const DOOR_W = OPEN_W - 0.06, DOOR_H = OPEN_H - 0.04;
const doorMat = new THREE.MeshStandardMaterial({ map: woodTex, color: "#9a7a62", roughness: 0.85 });
const door = new THREE.Mesh(new THREE.BoxGeometry(DOOR_W, DOOR_H, 0.09), doorMat);
door.position.set(DOOR_W / 2, DOOR_H / 2, 0);
hinge.add(door);
const panelMat = new THREE.MeshStandardMaterial({ map: woodTex, color: "#6e523f", roughness: 0.9 });
[[0.55, 3.35, 0.72, 1.0], [-0.42, 3.35, 0.72, 1.0], [0.55, 1.05, 0.72, 1.35], [-0.42, 1.05, 0.72, 1.35]].forEach(([x, y, w, h]) => {
  const p = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.03), panelMat);
  p.position.set(DOOR_W / 2 + x * 0.98 - 0.06, y, 0.055);
  hinge.add(p);
});
const brass = new THREE.MeshStandardMaterial({ color: "#c08a3e", metalness: 0.9, roughness: 0.35 });
const knob = new THREE.Mesh(new THREE.SphereGeometry(0.07, 24, 16), brass);
knob.position.set(DOOR_W - 0.22, 2.05, 0.14);
hinge.add(knob);
const plate = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.42, 0.02), brass);
plate.position.set(DOOR_W - 0.22, 2.0, 0.055);
hinge.add(plate);

/* ---------- neon sign ---------- */
const neon = new THREE.Group();
neon.position.set(DOOR_W / 2, 2.95, 0.1);
hinge.add(neon);

const ringColor = new THREE.Color("#ff9a2e");
const ringMats = [];
const GAP = 0.55;
[0.86, 0.79].forEach((r) => {
  const m = new THREE.MeshBasicMaterial({ color: ringColor.clone(), toneMapped: false });
  ringMats.push(m);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.022, 12, 160, TAU - GAP), m);
  ring.rotation.z = Math.PI / 2 + GAP / 2;
  neon.add(ring);
  // tube backing so it reads as glass, not a line
  const back = new THREE.Mesh(new THREE.TorusGeometry(r, 0.04, 8, 120, TAU - GAP), new THREE.MeshBasicMaterial({ color: "#ff8a2a", transparent: true, opacity: 0.18, toneMapped: false, depthWrite: false, blending: THREE.AdditiveBlending }));
  back.rotation.z = ring.rotation.z;
  neon.add(back);
});
// Little standoffs holding the tubes
[0.3, 2.2, 3.9].forEach((a) => {
  const s = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.1, 8), brass);
  s.rotation.x = Math.PI / 2;
  s.position.set(Math.cos(a) * 0.825, Math.sin(a) * 0.825, -0.04);
  neon.add(s);
});

let textMat;
async function buildNeonText() {
  try { await document.fonts.load('200px "Yellowtail"'); } catch {}
  const tex = canvasTex(1024, 1024, (ctx, w, h) => {
    ctx.clearRect(0, 0, w, h);
    ctx.textBaseline = "alphabetic";
    const passes = [
      { blur: 36, color: "rgba(255,90,45,0.9)", fill: "rgba(255,90,45,0.9)" },
      { blur: 14, color: "rgba(255,120,70,1)", fill: "#ff6a40" },
      { blur: 0, color: "transparent", fill: "#ffb39a" },
    ];
    const draw = (fn) => passes.forEach((p, i) => {
      ctx.save();
      ctx.shadowBlur = p.blur; ctx.shadowColor = p.color; ctx.fillStyle = p.fill; ctx.strokeStyle = p.fill;
      if (i === 2) { ctx.globalAlpha = 0.95; }
      fn(ctx, i);
      ctx.restore();
    });
    draw((c, i) => {
      c.font = '150px "Yellowtail", cursive';
      c.fillText("@The", 285, 395);
      c.font = '205px "Yellowtail", cursive';
      c.save(); c.translate(512, 600); c.rotate(-0.06);
      c.textAlign = "center";
      if (i === 2) { c.lineWidth = 2; c.strokeText("Penthouse", 0, 0); }
      c.fillText("Penthouse", 0, 0);
      c.restore();
    });
    // neon maple leaf sitting in the ring's gap
    ctx.save();
    ctx.translate(512, 100);
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    const leafPath = () => {
      ctx.beginPath();
      const pts = [];
      for (let k = 0; k <= 200; k++) {
        const a = -Math.PI / 2 + (k / 200) * TAU;
        const lobe = Math.pow(Math.abs(Math.cos(2.5 * (a + Math.PI / 2))), 1.6);
        const tooth = Math.pow(Math.abs(Math.cos(12.5 * (a + Math.PI / 2))), 6) * 6;
        const r = 22 + (56 * lobe + tooth) * (Math.sin(a) > 0.55 ? 0.55 : 1);
        pts.push([Math.cos(a) * r, Math.sin(a) * r]);
      }
      pts.forEach(([x, y], k) => (k ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
      ctx.closePath();
      ctx.moveTo(0, 20); ctx.lineTo(0, 92);
    };
    [[30, "rgba(255,160,40,0.9)", 9], [10, "rgba(255,180,60,1)", 6], [0, "transparent", 2.5]].forEach(([b, c, lw], i) => {
      ctx.shadowBlur = b; ctx.shadowColor = c; ctx.lineWidth = lw; ctx.strokeStyle = i === 2 ? "#fff0cc" : "#ffb347";
      leafPath(); ctx.stroke();
    });
    ctx.restore();
  });
  textMat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, toneMapped: false, blending: THREE.AdditiveBlending });
  textMat.color.setScalar(1.3);
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(2.0, 2.0), textMat);
  plane.position.z = 0.03;
  neon.add(plane);
}

const signLight = new THREE.PointLight("#ff8a3d", 6, 6, 1.6);
signLight.position.set(DOOR_W / 2, 2.95, 0.9);
hinge.add(signLight);

const spill = new THREE.PointLight("#ffb25a", 14, 7, 1.8);
spill.position.set(0.7, 1.2, -0.6);
scene.add(spill);
const spillFront = new THREE.SpotLight("#ff9a45", 40, 12, 0.55, 0.8, 1.6);
spillFront.position.set(0.8, 3.2, -1.4);
spillFront.target.position.set(1.4, 0, 3.5);
scene.add(spillFront, spillFront.target);
const moon = new THREE.DirectionalLight("#7a6aa8", 0.35);
moon.position.set(-4, 8, 6);
scene.add(moon);

/* ---------- floor ---------- */
const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ map: floorTex, color: "#7d6658", roughness: 1 }));
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

/* ---------- leaves ---------- */
function leafGeometry() {
  const s = new THREE.Shape();
  for (let k = 0; k <= 120; k++) {
    const a = -Math.PI / 2 + (k / 120) * TAU;
    const lobe = Math.pow(Math.abs(Math.cos(2.5 * (a + Math.PI / 2))), 1.6);
    const tooth = Math.pow(Math.abs(Math.cos(12.5 * (a + Math.PI / 2))), 6) * 0.08;
    const low = Math.sin(a) > 0.55 ? 0.55 : 1; // smaller lobes beside the stem
    const r = 0.32 + (0.68 * lobe + tooth) * low;
    const x = Math.cos(a) * r, y = -Math.sin(a) * r;
    k ? s.lineTo(x, y) : s.moveTo(x, y);
  }
  const g = new THREE.ShapeGeometry(s, 1);
  g.scale(0.11, 0.11, 0.11);
  // gentle cup so they catch light
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { const x = p.getX(i), y = p.getY(i); p.setZ(i, (x * x + y * y) * 1.6); }
  g.computeVertexNormals();
  return g;
}
const leafColors = ["#c2410c", "#ea580c", "#b45309", "#d97706", "#9f1239", "#7c2d12", "#ca8a04"].map((c) => new THREE.Color(c));
const leafMat = new THREE.MeshStandardMaterial({ side: THREE.DoubleSide, roughness: 0.7, metalness: 0 });
const lgeo = leafGeometry();

const FALL = 90, GUST = 46, GROUND = 140;
const falling = new THREE.InstancedMesh(lgeo, leafMat, FALL);
const gust = new THREE.InstancedMesh(lgeo, leafMat, GUST);
const ground = new THREE.InstancedMesh(lgeo, leafMat, GROUND);
[falling, gust, ground].forEach((m) => { m.frustumCulled = false; scene.add(m); });

const fallData = Array.from({ length: FALL }, () => ({
  x: (rand() - 0.5) * 9, z: 0.4 + rand() * 6.5, top: 7 + rand() * 2,
  k: [1, 2, 3][Math.floor(rand() * 3)], p: rand(), sway: 0.2 + rand() * 0.5, sp: rand() * TAU,
  rx: rand() * TAU, ry: rand() * TAU, s: 0.7 + rand() * 0.8,
}));
const gustData = Array.from({ length: GUST }, () => ({
  k: [1, 2][Math.floor(rand() * 2)], p: rand(),
  ex: 0.6 + rand() * 5.5, ey: 0.6 + rand() * 4.8, ez: 4 + rand() * 4, curve: (rand() - 0.3) * 2,
  rx: rand() * TAU, ry: rand() * TAU, s: 0.6 + rand() * 0.7,
}));
const dummy = new THREE.Object3D();
fallData.forEach((d, i) => falling.setColorAt(i, leafColors[i % leafColors.length]));
gustData.forEach((d, i) => gust.setColorAt(i, leafColors[(i * 3) % leafColors.length]));
for (let i = 0; i < GROUND; i++) {
  const r = Math.pow(rand(), 0.7) * 6, a = rand() * TAU;
  dummy.position.set(Math.cos(a) * r * 1.3 + 0.4, 0.01 + rand() * 0.02, 0.4 + Math.abs(Math.sin(a)) * r);
  dummy.rotation.set(-Math.PI / 2 + (rand() - 0.5) * 0.4, (rand() - 0.5) * 0.4, rand() * TAU);
  dummy.scale.setScalar(0.8 + rand() * 0.9);
  dummy.updateMatrix();
  ground.setMatrixAt(i, dummy.matrix);
  ground.setColorAt(i, leafColors[i % leafColors.length].clone().multiplyScalar(0.55));
}

/* ---------- embers ---------- */
const dotTex = canvasTex(64, 64, (ctx, w, h) => {
  const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, "rgba(255,255,255,1)"); g.addColorStop(0.35, "rgba(255,255,255,0.6)"); g.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
});
const EMBERS = 70;
const emberGeo = new THREE.BufferGeometry();
emberGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(EMBERS * 3), 3));
const emberData = Array.from({ length: EMBERS }, () => ({
  x: (rand() - 0.5) * 2.4 + 0.3, z: -1.2 + rand() * 6, k: [1, 2, 3][Math.floor(rand() * 3)], p: rand(), w: rand() * TAU, h: 3 + rand() * 4,
}));
const embers = new THREE.Points(emberGeo, new THREE.PointsMaterial({
  color: new THREE.Color("#ffc35a").multiplyScalar(2), size: 0.05, map: dotTex, alphaTest: 0.01, transparent: true, opacity: 0.85,
  blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false, sizeAttenuation: true,
}));
scene.add(embers);

/* ---------- post ---------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(512, 640), 0.5, 0.45, 0.55);
composer.addPass(bloom);
composer.addPass(new OutputPass());

function resize() {
  const r = stage.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(dpr);
  renderer.setSize(r.width, r.height, false);
  composer.setPixelRatio(dpr);
  composer.setSize(r.width, r.height);
  camera.aspect = r.width / r.height;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

/* ---------- timeline ---------- */
const reveals = [...document.querySelectorAll(".reveal")].map((el) => ({ el, at: parseFloat(el.dataset.at) }));
const fadeEl = document.getElementById("fade");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

function neonLevel(t) {
  // flickers on around 0.6s, then a stray stutter every loop
  if (t < 0.5) return 0;
  if (t < 1.3) {
    const f = [0.9, 0, 0.6, 0, 0, 1, 0.3, 1, 1];
    return f[Math.floor((t - 0.5) / 0.09)] ?? 1;
  }
  const lt = t % LOOP;
  if (lt > 7.2 && lt < 7.45) return lt < 7.28 || lt > 7.36 ? 0.35 : 1;
  return 1;
}

function renderAt(t, intro = true) {
  const lt = t % LOOP;
  const u = (k, p) => ((lt / LOOP) * k + p) % 1;

  // camera: slow push from the path toward the door, then a breathing drift
  const push = intro ? ease(t / 6) : 1;
  const camZ = 12.2 - push * 3.4 + Math.sin(lt / LOOP * TAU) * 0.15;
  const camX = 0.7 - push * 0.5 + Math.sin(lt / LOOP * TAU * 2) * 0.12;
  camera.position.set(camX, 1.35 + push * 0.25, camZ);
  camera.lookAt(0.25, 2.25 - push * 0.15, 0);

  // door breathes on its hinge a touch
  hinge.rotation.y = 0.5 + Math.sin(lt / LOOP * TAU) * 0.025;

  const n = reduced ? 1 : neonLevel(t);
  const pulse = 1 + Math.sin(lt * 2.1) * 0.04;
  ringMats.forEach((m) => m.color.copy(ringColor).multiplyScalar((0.04 + n * 1.9) * pulse));
  if (textMat) textMat.color.setScalar((0.03 + n * 1.05) * pulse);
  signLight.intensity = 0.4 + n * 11;
  glow.material.color.setScalar(0.8 + Math.sin(lt * 1.3) * 0.08 + (intro ? (1 - ease(t / 2)) * -0.6 : 0));

  fallData.forEach((d, i) => {
    const f = u(d.k, d.p);
    const ang = lt / LOOP * TAU * d.k;
    dummy.position.set(d.x + Math.sin(ang * 2 + d.sp) * d.sway, d.top - f * (d.top + 0.2), d.z + Math.cos(ang + d.sp) * 0.3);
    dummy.rotation.set(d.rx + ang * 2, d.ry + ang * 3, ang);
    dummy.scale.setScalar(d.s * Math.min(1, (1 - f) * 12));
    dummy.updateMatrix();
    falling.setMatrixAt(i, dummy.matrix);
  });
  falling.instanceMatrix.needsUpdate = true;

  gustData.forEach((d, i) => {
    const f = u(d.k, d.p);
    const e = f * f * (3 - 2 * f);
    const sx = 0.55 + (i % 5) * 0.12, sy = 0.6 + ((i * 7) % 11) * 0.3, sz = -1.0;
    dummy.position.set(sx + (d.ex - sx) * e + Math.sin(f * Math.PI) * d.curve, sy + (d.ey - sy) * e + Math.sin(f * 9 + i) * 0.12, sz + (d.ez - sz) * e);
    const ang = lt / LOOP * TAU * d.k;
    dummy.rotation.set(d.rx + ang * 3, d.ry + ang * 2, ang * 1.5);
    dummy.scale.setScalar(d.s * Math.sin(f * Math.PI) * 1.3);
    dummy.updateMatrix();
    gust.setMatrixAt(i, dummy.matrix);
  });
  gust.instanceMatrix.needsUpdate = true;

  const ep = emberGeo.attributes.position;
  emberData.forEach((d, i) => {
    const f = u(d.k, d.p);
    ep.setXYZ(i, d.x + Math.sin(f * TAU * 2 + d.w) * 0.35, 0.2 + f * d.h, d.z + Math.cos(f * TAU + d.w) * 0.3);
  });
  ep.needsUpdate = true;

  composer.render();

  // type
  reveals.forEach(({ el, at }) => {
    const k = intro && !reduced ? ease((t - at) / 0.9) : 1;
    el.style.opacity = k;
    el.style.transform = `translateY(${(1 - k) * 2}cqw)`;
  });
  fadeEl.style.opacity = intro ? 1 - ease(t / 1.2) : 0;
}

await buildNeonText();

if (CAPTURE) {
  window.renderAt = (t) => {
    renderAt(t, true);
    // fade out over the last half second so the video loops cleanly
    if (t > LOOP - 0.6) fadeEl.style.opacity = clamp01((t - (LOOP - 0.6)) / 0.6);
  };
  window.flyerReady = true;
} else {
  const t0 = performance.now();
  const tick = () => {
    const t = (performance.now() - t0) / 1000;
    renderAt(t, true);
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
</script>
