<title>Friendsgiving Party Flyer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&family=Yellowtail&display=swap">
<style>
  /* Layout: a 4:5 poster. Big bouncy wordmark up top, the neon Penthouse sign floating mid-frame, Gobbles the turkey cheering from the bottom. */
  :root {
    --dusk: #2a0f3d;
    --ink: #ffffff;
    --pumpkin: #ff9600;
    --pumpkin-deep: #c25a00;
    --berry: #ff4b6e;
    --display: "Nunito", "Arial Rounded MT Bold", "Helvetica Neue", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--dusk);
    color: var(--ink);
    display: grid;
    place-items: center;
    overflow: hidden;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px;
    box-sizing: border-box;
  }
  body.capture { padding: 0; }
  .stage {
    position: relative;
    width: min(100%, calc((100dvh - 32px) * 0.8));
    max-width: 100%;
    aspect-ratio: 4 / 5;
    border-radius: 22px;
    overflow: hidden;
    container-type: inline-size;
    background: var(--dusk);
  }
  body.capture .stage { width: 100vw; border-radius: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .word {
    position: absolute; left: 0; right: 0; top: 6.5cqw;
    display: flex; justify-content: center;
    font-family: var(--display); font-weight: 900;
    font-size: 13.6cqw; line-height: 1; letter-spacing: -0.02em;
    pointer-events: none;
  }
  .word span {
    display: inline-block;
    color: var(--ink);
    text-shadow:
      0 0.6cqw 0 var(--pumpkin),
      0 1.2cqw 0 var(--pumpkin),
      0 1.8cqw 0 var(--pumpkin-deep),
      0 2.6cqw 3cqw rgb(0 0 0 / 0.35);
    will-change: transform, opacity;
  }
  .word span:nth-child(n+8) { color: #ffe08a; }

  .fade { position: absolute; inset: 0; background: var(--dusk); opacity: 0; pointer-events: none; }
  .fallback { position: absolute; inset: 0; display: none; place-items: center; font: 900 5cqw var(--display); text-align: center; }
</style>

<div class="stage" id="stage">
  <canvas id="gl" aria-label="Gobbles the turkey bouncing under a glowing neon sign that reads @The Penthouse, with confetti and leaves falling."></canvas>
  <div class="word" id="word" aria-label="Friendsgiving"></div>
  <div class="fade" id="fade"></div>
  <div class="fallback" id="fallback">Friendsgiving<br>@ The Penthouse</div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const CAPTURE = location.hash === "#capture";
const LOOP = 10;
if (CAPTURE) document.body.classList.add("capture");
const TAU = Math.PI * 2;
const clamp01 = (x) => Math.min(Math.max(x, 0), 1);
const easeOutBack = (x) => { x = clamp01(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const rand = (() => { let s = 11; return () => ((s = (s * 16807) % 2147483647) / 2147483647); })();
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- wordmark ---------- */
const wordEl = document.getElementById("word");
const letters = [..."Friendsgiving"].map((ch) => {
  const s = document.createElement("span");
  s.textContent = ch;
  s.setAttribute("aria-hidden", "true");
  wordEl.appendChild(s);
  return s;
});

/* ---------- renderer ---------- */
const stage = document.getElementById("stage");
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), antialias: true, preserveDrawingBuffer: CAPTURE });
} catch (e) {
  document.getElementById("fallback").style.display = "grid";
  wordEl.style.display = "none";
  throw e;
}
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
{
  const c = document.createElement("canvas");
  c.width = 32; c.height = 512;
  const g = c.getContext("2d");
  const grd = g.createLinearGradient(0, 0, 0, 512);
  grd.addColorStop(0, "#1e0b33");
  grd.addColorStop(0.45, "#4a1858");
  grd.addColorStop(0.8, "#b8325a");
  grd.addColorStop(1, "#ff7a3a");
  g.fillStyle = grd; g.fillRect(0, 0, 32, 512);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  scene.background = t;
}

const camera = new THREE.PerspectiveCamera(38, 4 / 5, 0.1, 100);
camera.position.set(0, 0.4, 12);

scene.add(new THREE.HemisphereLight("#ffd9b0", "#5a2050", 1.6));
const key = new THREE.DirectionalLight("#fff1dd", 2.4);
key.position.set(3, 5, 6);
scene.add(key);
const rim = new THREE.DirectionalLight("#ff6ad5", 1.4);
rim.position.set(-4, 2, -3);
scene.add(rim);

// Toon ramp for a cartoon finish
const ramp = (() => {
  const data = new Uint8Array([90, 170, 255]);
  const t = new THREE.DataTexture(data, 3, 1, THREE.RedFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter;
  t.needsUpdate = true;
  return t;
})();
const toon = (c) => new THREE.MeshToonMaterial({ color: c, gradientMap: ramp });

/* ---------- neon sign ---------- */
const sign = new THREE.Group();
sign.position.set(0, 0.85, 0);
sign.scale.setScalar(0.88);
scene.add(sign);
const ringMats = [];
const GAP = 0.5;
[1.95, 1.8].forEach((r) => {
  const m = new THREE.MeshBasicMaterial({ color: "#ffb03a", toneMapped: false });
  ringMats.push(m);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.05, 14, 180, TAU - GAP), m);
  ring.rotation.z = Math.PI / 2 + GAP / 2;
  sign.add(ring);
});
// little neon leaf in the ring's gap
let textMat;
async function buildSignText() {
  try { await document.fonts.load('200px "Yellowtail"'); } catch {}
  const c = document.createElement("canvas");
  c.width = 1024; c.height = 1024;
  const ctx = c.getContext("2d");
  const passes = [[40, "rgba(255,70,110,0.95)", "#ff4b6e"], [14, "rgba(255,110,140,1)", "#ff6a88"], [0, "transparent", "#ffd0dc"]];
  passes.forEach(([b, sc, f]) => {
    ctx.save();
    ctx.shadowBlur = b; ctx.shadowColor = sc; ctx.fillStyle = f;
    ctx.font = '150px "Yellowtail", cursive';
    ctx.fillText("@The", 270, 420);
    ctx.font = '210px "Yellowtail", cursive';
    ctx.translate(512, 625); ctx.rotate(-0.06); ctx.textAlign = "center";
    ctx.fillText("Penthouse", 0, 0);
    ctx.restore();
  });
  // neon maple leaf at the top
  ctx.save();
  ctx.translate(512, 92);
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  const leaf = () => {
    ctx.beginPath();
    for (let k = 0; k <= 200; k++) {
      const a = -Math.PI / 2 + (k / 200) * TAU;
      const lobe = Math.pow(Math.abs(Math.cos(2.5 * (a + Math.PI / 2))), 1.6);
      const tooth = Math.pow(Math.abs(Math.cos(12.5 * (a + Math.PI / 2))), 6) * 6;
      const r = 22 + (56 * lobe + tooth) * (Math.sin(a) > 0.55 ? 0.55 : 1);
      const x = Math.cos(a) * r, y = Math.sin(a) * r;
      k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath();
    ctx.moveTo(0, 20); ctx.lineTo(0, 92);
  };
  [[30, "rgba(255,170,40,0.9)", 9, "#ffb03a"], [10, "rgba(255,190,60,1)", 6, "#ffb03a"], [0, "transparent", 2.5, "#fff0cc"]].forEach(([b, sc, lw, st]) => {
    ctx.shadowBlur = b; ctx.shadowColor = sc; ctx.lineWidth = lw; ctx.strokeStyle = st;
    leaf(); ctx.stroke();
  });
  ctx.restore();
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  textMat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, toneMapped: false, blending: THREE.AdditiveBlending });
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(4.6, 4.6), textMat);
  plane.position.z = 0.02;
  sign.add(plane);
}
const signGlow = new THREE.PointLight("#ff7aa0", 8, 8, 1.5);
signGlow.position.set(0, 0.8, 1.5);
scene.add(signGlow);

/* ---------- Gobbles, in 3D ---------- */
const turkey = new THREE.Group();
turkey.position.set(0, -2.75, 1.2);
turkey.scale.setScalar(0.74);
scene.add(turkey);
const bod = new THREE.Group();
turkey.add(bod);

const FEATHERS = ["#ff4b4b", "#ff9600", "#ffc800", "#58cc02", "#1cb0f6", "#ffc800", "#ff9600", "#ff4b4b"];
const fan = new THREE.Group();
fan.position.set(0, 0.2, -0.55);
bod.add(fan);
const feathers = FEATHERS.map((c, i) => {
  const pivot = new THREE.Group();
  const f = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 1.5, 8, 16), toon(c));
  f.position.y = 1.15;
  f.scale.z = 0.35;
  pivot.add(f);
  pivot.userData.base = -1.25 + (i * 2.5) / (FEATHERS.length - 1);
  pivot.position.z = -Math.abs(i - (FEATHERS.length - 1) / 2) * 0.02;
  fan.add(pivot);
  return pivot;
});

const brown = toon("#a0612f");
const body = new THREE.Mesh(new THREE.SphereGeometry(1.05, 40, 32), brown);
body.scale.set(1, 0.95, 0.9);
bod.add(body);
const belly = new THREE.Mesh(new THREE.SphereGeometry(0.68, 32, 24), toon("#d39a62"));
belly.position.set(0, -0.05, 0.66);
belly.scale.set(1, 1.05, 0.5);
bod.add(belly);

const head = new THREE.Group();
head.position.set(0, 1.18, 0.25);
bod.add(head);
head.add(new THREE.Mesh(new THREE.SphereGeometry(0.62, 32, 24), brown));
const eyeWhite = toon("#ffffff"), pupilMat = new THREE.MeshBasicMaterial({ color: "#2a2a2a" });
const eyes = [-0.22, 0.22].map((x) => {
  const g = new THREE.Group();
  g.position.set(x, 0.12, 0.48);
  const w = new THREE.Mesh(new THREE.SphereGeometry(0.2, 24, 16), eyeWhite);
  w.scale.z = 0.6;
  g.add(w);
  const p = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 12), pupilMat);
  p.position.set(x * 0.15, 0.01, 0.12);
  g.add(p);
  const s = new THREE.Mesh(new THREE.SphereGeometry(0.035, 8, 8), new THREE.MeshBasicMaterial({ color: "#fff" }));
  s.position.set(x * 0.15 + 0.04, 0.05, 0.2);
  g.add(s);
  head.add(g);
  return g;
});
const beak = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.32, 16), toon("#ffc800"));
beak.rotation.x = Math.PI / 2;
beak.position.set(0, -0.08, 0.66);
head.add(beak);
const wattle = new THREE.Mesh(new THREE.CapsuleGeometry(0.065, 0.12, 6, 10), toon("#ff3b4f"));
wattle.position.set(0.1, -0.3, 0.55);
wattle.rotation.z = 0.3;
head.add(wattle);
[-0.38, 0.38].forEach((x) => {
  const ch = new THREE.Mesh(new THREE.CircleGeometry(0.09, 16), new THREE.MeshBasicMaterial({ color: "#ff86a0", transparent: true, opacity: 0.6 }));
  ch.position.set(x, -0.1, 0.52 + 0.04);
  ch.lookAt(x * 3, -0.1, 3);
  head.add(ch);
});

const wings = [-1, 1].map((s) => {
  const pivot = new THREE.Group();
  pivot.position.set(s * 0.95, 0.15, 0.1);
  const w = new THREE.Mesh(new THREE.SphereGeometry(0.42, 24, 16), toon("#8a4f22"));
  w.scale.set(0.45, 0.85, 0.6);
  w.position.set(s * 0.12, -0.3, 0);
  pivot.add(w);
  pivot.userData.side = s;
  bod.add(pivot);
  return pivot;
});
const footMat = toon("#ff9600");
[-0.35, 0.35].forEach((x) => {
  const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.4, 10), footMat);
  leg.position.set(x, -1.05, 0.1);
  turkey.add(leg);
  const foot = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 10), footMat);
  foot.scale.set(1.2, 0.4, 1.4);
  foot.position.set(x, -1.25, 0.22);
  turkey.add(foot);
});
const shadow = new THREE.Mesh(new THREE.CircleGeometry(1.1, 32), new THREE.MeshBasicMaterial({ color: "#000", transparent: true, opacity: 0.25 }));
shadow.rotation.x = -Math.PI / 2;
shadow.position.set(0, -1.32, 0.1);
turkey.add(shadow);

/* ---------- confetti + leaves ---------- */
const CONF = 120;
const confetti = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.16, 0.26), new THREE.MeshToonMaterial({ side: THREE.DoubleSide, gradientMap: ramp }), CONF);
confetti.frustumCulled = false;
scene.add(confetti);
const confColors = ["#ff9600", "#58cc02", "#1cb0f6", "#ffc800", "#ff4b4b", "#ce82ff", "#ffffff"].map((c) => new THREE.Color(c));
const confData = Array.from({ length: CONF }, (_, i) => {
  confetti.setColorAt(i, confColors[i % confColors.length]);
  return { x: (rand() - 0.5) * 11, z: -3 + rand() * 7, k: [1, 2, 3][Math.floor(rand() * 3)], p: rand(), sway: 0.3 + rand() * 0.6, sp: rand() * TAU, rx: rand() * TAU, ry: rand() * TAU, s: 0.7 + rand() * 0.6 };
});

function leafGeo() {
  const s = new THREE.Shape();
  for (let k = 0; k <= 120; k++) {
    const a = -Math.PI / 2 + (k / 120) * TAU;
    const lobe = Math.pow(Math.abs(Math.cos(2.5 * (a + Math.PI / 2))), 1.6);
    const tooth = Math.pow(Math.abs(Math.cos(12.5 * (a + Math.PI / 2))), 6) * 0.08;
    const r = 0.32 + (0.68 * lobe + tooth) * (Math.sin(a) > 0.55 ? 0.55 : 1);
    const x = Math.cos(a) * r, y = -Math.sin(a) * r;
    k ? s.lineTo(x, y) : s.moveTo(x, y);
  }
  const g = new THREE.ShapeGeometry(s);
  g.scale(0.3, 0.3, 0.3);
  return g;
}
const LEAVES = 36;
const leaves = new THREE.InstancedMesh(leafGeo(), new THREE.MeshToonMaterial({ side: THREE.DoubleSide, gradientMap: ramp }), LEAVES);
leaves.frustumCulled = false;
scene.add(leaves);
const leafColors = ["#ff6a1a", "#ff9600", "#e8452c", "#ffc800", "#c2410c"].map((c) => new THREE.Color(c));
const leafData = Array.from({ length: LEAVES }, (_, i) => {
  leaves.setColorAt(i, leafColors[i % leafColors.length]);
  return { x: (rand() - 0.5) * 10, z: -2 + rand() * 6, k: [1, 2][Math.floor(rand() * 2)], p: rand(), sway: 0.5 + rand() * 0.8, sp: rand() * TAU, rx: rand() * TAU, s: 0.7 + rand() * 0.7 };
});
const dummy = new THREE.Object3D();

/* ---------- post ---------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(512, 640), 0.7, 0.5, 0.8));
composer.addPass(new OutputPass());

function resize() {
  const r = stage.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(dpr);
  renderer.setSize(r.width, r.height, false);
  composer.setPixelRatio(dpr);
  composer.setSize(r.width, r.height);
  camera.aspect = r.width / r.height;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

/* ---------- timeline ---------- */
const HOP = LOOP / 3; // Gobbles hops three times a loop
let blinkSeed = 0;

function neon(t) {
  if (t < 0.7) return 0;
  if (t < 1.4) return [1, 0, 0.7, 0, 1, 0.4, 1, 1][Math.floor((t - 0.7) / 0.09)] ?? 1;
  return 1;
}

function renderAt(t, intro = true) {
  const lt = t % LOOP;
  const ph = lt / LOOP * TAU;

  // camera sway
  camera.position.set(Math.sin(ph) * 0.8, 0.4 + Math.sin(ph * 2) * 0.15, 12);
  camera.lookAt(0, 0.2, 0);

  // sign floats and tilts
  sign.position.y = 0.85 + Math.sin(ph * 2) * 0.12;
  sign.rotation.y = Math.sin(ph) * 0.18;
  sign.rotation.z = Math.sin(ph * 2 + 1) * 0.03;
  const n = reduced ? 1 : neon(t);
  const pulse = 1 + Math.sin(lt * 3) * 0.04;
  ringMats.forEach((m) => m.color.set("#ffb03a").multiplyScalar((0.05 + n * 1.55) * pulse));
  if (textMat) textMat.color.setScalar((0.03 + n * 1.0) * pulse);
  signGlow.intensity = 1 + n * 8;

  // turkey: pop up on intro, then hop
  const rise = intro ? easeOutBack((t - 1.0) / 0.8) : 1;
  const hp = (lt % HOP) / HOP; // 0..1 per hop
  const hopY = hp < 0.3 ? Math.sin((hp / 0.3) * Math.PI) * 0.75 : 0;
  const squash = hp < 0.05 ? 1 - (hp / 0.05) * 0.12 : hp > 0.3 && hp < 0.38 ? 0.88 + ((hp - 0.3) / 0.08) * 0.12 : 1;
  turkey.position.y = -2.75 - (1 - rise) * 3 + hopY * 0.8;
  bod.scale.set(1 / Math.sqrt(squash), squash, 1 / Math.sqrt(squash));
  turkey.rotation.y = Math.sin(ph) * 0.35;
  bod.rotation.z = hp < 0.3 ? Math.sin((hp / 0.3) * TAU) * 0.08 : Math.sin(ph * 3) * 0.03;
  shadow.scale.setScalar(1 - hopY * 0.4);
  shadow.material.opacity = 0.25 - hopY * 0.12;

  const spread = 1 + (hp < 0.35 ? Math.sin((hp / 0.35) * Math.PI) * 0.15 : 0) + Math.sin(ph * 4) * 0.02;
  feathers.forEach((f, i) => { f.rotation.z = f.userData.base * spread + Math.sin(ph * 4 + i) * 0.02; });
  wings.forEach((w) => { w.rotation.z = w.userData.side * (hp < 0.35 ? 0.3 + Math.sin((hp / 0.35) * Math.PI * 4) * 0.5 : 0.1 + Math.sin(ph * 5) * 0.06); });
  head.rotation.z = Math.sin(ph * 3) * 0.1;
  head.rotation.x = Math.sin(ph * 2) * 0.06;
  // blink twice a loop
  const b = [2.4, 6.9].some((bt) => Math.abs(lt - bt) < 0.07);
  eyes.forEach((e) => (e.scale.y = b ? 0.1 : 1));

  confData.forEach((d, i) => {
    const f = ((lt / LOOP) * d.k + d.p) % 1;
    const a = ph * d.k;
    dummy.position.set(d.x + Math.sin(a * 2 + d.sp) * d.sway, 7 - f * 14, d.z);
    dummy.rotation.set(d.rx + a * 3, d.ry + a * 2, a);
    dummy.scale.setScalar(d.s);
    dummy.updateMatrix();
    confetti.setMatrixAt(i, dummy.matrix);
  });
  confetti.instanceMatrix.needsUpdate = true;
  leafData.forEach((d, i) => {
    const f = ((lt / LOOP) * d.k + d.p) % 1;
    const a = ph * d.k;
    dummy.position.set(d.x + Math.sin(a * 1.5 + d.sp) * d.sway, 7 - f * 14, d.z);
    dummy.rotation.set(d.rx + a * 2, a * 1.5, Math.sin(a + d.sp) * 0.8);
    dummy.scale.setScalar(d.s);
    dummy.updateMatrix();
    leaves.setMatrixAt(i, dummy.matrix);
  });
  leaves.instanceMatrix.needsUpdate = true;

  composer.render();

  // wordmark: letters drop in one by one, then do a little wave
  letters.forEach((el, i) => {
    const k = intro && !reduced ? easeOutBack((t - 0.15 - i * 0.06) / 0.5) : 1;
    const wave = reduced ? 0 : Math.max(0, Math.sin(ph * 2 - i * 0.45)) ** 6 * -2.2;
    el.style.opacity = clamp01(k * 3);
    el.style.transform = `translateY(${(1 - k) * -18 + wave}cqw) rotate(${(1 - k) * (i % 2 ? 12 : -12)}deg)`;
  });
}

await buildSignText();
const fadeEl = document.getElementById("fade");

if (CAPTURE) {
  window.renderAt = (t) => {
    renderAt(t, true);
    fadeEl.style.opacity = t > LOOP - 0.5 ? clamp01((t - (LOOP - 0.5)) / 0.5) : 0;
  };
  window.flyerReady = true;
} else {
  const t0 = performance.now();
  const tick = () => {
    renderAt((performance.now() - t0) / 1000, true);
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
</script>
